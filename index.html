<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AstraLog">
<title>AstraLog</title>
<style>
  :root{
    /* 鉄紺の闇 ― 黒に青と紫が沈んでいる */
    --void-0:#05060d;
    --void-1:#080a17;
    --void-2:#0c0f23;
    --panel:rgba(18,22,46,0.42);
    --panel-line:rgba(120,140,220,0.14);
    /* 青白い光 */
    --glow:#cfe0ff;
    --glow-soft:#9db4e6;
    --ink:#e6ecff;      /* 通常の文字 */
    --ink-dim:#8a93bd;  /* 沈んだ文字 */
    --ink-faint:#565f8a;
    --accent:#a99cff;   /* 差し色の紫 */
    --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",-apple-system,system-ui,sans-serif;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    /* 英語の声：軽い細身サンセリフ（現代的・澄んだ） */
    --voice:-apple-system,"SF Pro Display","Helvetica Neue","Inter","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, #10143a 0%, transparent 55%),
      radial-gradient(140% 100% at 50% 120%, #0a0b22 0%, transparent 60%),
      linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 100%);
    background-attachment:fixed;
    min-height:100%;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* 光のモヤを描くキャンバス：全面固定の背景 */
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  /* うっすら星屑（記録の名残を後で星空にする布石。今は静かな点だけ） */
  #dust{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;}

  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 86px);
    min-height:100%;display:flex;flex-direction:column;}

  /* 上部：日付と連続 */
  .top{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mincho);letter-spacing:.14em;}
  .date{color:var(--ink-dim);font-size:14px;}
  .date .d{color:var(--ink);font-size:20px;margin-left:.15em;}
  .streak{color:var(--ink-dim);font-size:13px;letter-spacing:.1em;}
  .streak b{color:var(--glow);font-weight:400;font-size:17px;font-family:var(--mincho);
    text-shadow:0 0 14px rgba(160,190,255,.5);}

  /* 光の居場所（キャンバスが背後で光る帯）＋ 闇に浮かぶ声 */
  .hero{flex:0 0 auto;min-height:46vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;position:relative;}
  .voice{font-family:var(--voice);font-weight:200;color:var(--glow);
    font-size:21px;line-height:1.65;letter-spacing:.04em;
    text-shadow:0 0 22px rgba(150,185,255,.5), 0 0 46px rgba(120,150,255,.22);
    opacity:0;animation:rise 2.4s ease forwards;padding:0 12px;}
  .voice .sub{display:block;margin-top:14px;font-size:13px;letter-spacing:.16em;
    color:var(--ink-dim);text-shadow:none;font-weight:300;font-family:var(--mincho);line-height:1.7;}
  .voice .who{display:block;margin-top:12px;font-size:11px;letter-spacing:.18em;
    color:var(--ink-faint);font-family:var(--voice);font-weight:300;}
  .voice .ph{white-space:nowrap;}          /* 句読点までの塊は途中で切らない */
  .voice .ph.long{white-space:normal;}     /* 長すぎる塊だけ内部でも折る */
  .voice.fulfilled{color:#eaf1ff;text-shadow:0 0 26px rgba(200,220,255,.7),0 0 52px rgba(150,185,255,.4);}
  .voice .invite{font-family:var(--voice);font-weight:300;color:var(--ink-dim);
    font-size:18px;letter-spacing:.08em;line-height:1.8;cursor:pointer;}
  .voice-actions{display:flex;justify-content:center;gap:8px;margin-top:16px;min-height:0;flex-wrap:wrap;}
  .voice-actions:empty{display:none;}
  .voice-actions button{font-family:var(--sans);font-size:12px;color:var(--ink-dim);
    background:rgba(140,160,230,.06);border:1px solid var(--panel-line);border-radius:10px;
    padding:8px 14px;cursor:pointer;letter-spacing:.08em;transition:.15s;}
  .voice-actions button:active{background:rgba(160,190,255,.16);}
  .voice-actions button[data-wa="done"]{color:var(--glow);border-color:rgba(160,195,255,.35);}
  .voice-actions button[data-wa="del"]{color:#bf5568;border-color:rgba(191,85,104,.28);}
  /* ドット差異：願いは小さめ、叶えた願いは満ちて輝く、末尾は＋ */
  .voice-dots{flex-wrap:wrap;}
  .voice-dots .vd.wish{width:4px;height:4px;opacity:.22;}
  .voice-dots .vd.wish.on{opacity:1;transform:scale(1.35);}
  .voice-dots .vd.wish.wdone{background:#eaf1ff;opacity:.6;
    box-shadow:0 0 7px 1px rgba(210,225,255,.7);}
  .voice-dots .vd.wish.wdone.on{opacity:1;}
  .voice-dots .vd.add{width:auto;height:auto;background:none;box-shadow:none;
    font-size:11px;line-height:1;color:var(--ink-faint);opacity:.6;transform:none;}
  .voice-dots .vd.add.on{opacity:1;color:var(--glow);}
  /* 声の切替を示す小さな星（Wisdom / Starlight） */
  .voice-dots{display:flex;justify-content:center;gap:14px;margin-top:22px;height:10px;}
  .voice-dots .vd{width:5px;height:5px;border-radius:50%;background:var(--glow);
    opacity:.28;cursor:pointer;transition:.35s;transform:scale(.85);}
  .voice-dots .vd.on{opacity:1;transform:scale(1.25);
    box-shadow:0 0 10px 2px rgba(180,205,255,.7),0 0 18px 4px rgba(150,185,255,.3);}
  @keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(6px);}
    to{opacity:1;transform:none;filter:blur(0);}}

  /* 記録カード */
  .card{background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;
    padding:20px 18px 22px;margin-top:14px;backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);}
  .card + .card{margin-top:14px;}
  .label{font-size:12px;letter-spacing:.24em;color:var(--ink-faint);
    text-transform:none;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;}
  .label .val{color:var(--glow);font-size:15px;letter-spacing:.08em;font-family:var(--mincho);}

  /* 体調：4択ワンタップ */
  .mood{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .mood button{font-family:var(--sans);font-size:14px;color:var(--ink-dim);
    background:rgba(140,160,230,.05);border:1px solid var(--panel-line);
    border-radius:14px;padding:14px 4px;cursor:pointer;transition:.25s;letter-spacing:.02em;}
  .mood button:active{transform:scale(.95);}
  .mood button.on{color:var(--void-0);background:var(--glow);border-color:var(--glow);
    box-shadow:0 0 20px rgba(160,195,255,.5);font-weight:600;}

  /* 水分：+/− タップで加算 */
  .water-total{text-align:center;font-family:var(--mincho);margin-bottom:16px;}
  .water-total .n{font-size:40px;color:var(--glow);letter-spacing:.02em;
    text-shadow:0 0 24px rgba(150,185,255,.4);}
  .water-total .u{font-size:15px;color:var(--ink-dim);margin-left:4px;letter-spacing:.1em;}
  .water-total .last{display:block;font-size:11px;color:var(--ink-faint);
    letter-spacing:.16em;margin-top:6px;font-family:var(--sans);min-height:14px;}
  .adds{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:10px;}
  .adds button{font-family:var(--sans);font-size:15px;color:var(--glow);
    background:rgba(140,160,230,.06);border:1px solid var(--panel-line);
    border-radius:14px;padding:15px 4px;cursor:pointer;transition:.15s;letter-spacing:.02em;}
  .adds button:active{transform:scale(.94);background:rgba(160,190,255,.18);}
  .undo{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink-faint);
    background:transparent;border:1px solid rgba(120,140,220,.1);border-radius:12px;
    padding:11px;cursor:pointer;letter-spacing:.14em;transition:.2s;}
  .undo:active{color:var(--ink-dim);}
  .undo:disabled{opacity:.35;}

  .footnote{margin-top:26px;text-align:center;font-size:11px;color:var(--ink-faint);
    letter-spacing:.2em;font-family:var(--mincho);}

  /* ビュー切替 */
  [hidden]{display:none !important;}
  .view{display:flex;flex-direction:column;}

  /* 下部タブ */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;
    justify-content:center;gap:6px;
    padding:12px 0 calc(env(safe-area-inset-bottom) + 14px);
    background:linear-gradient(0deg, rgba(5,6,13,.94) 40%, rgba(5,6,13,0));}
  .tab{font-family:var(--mincho);font-size:14px;letter-spacing:.26em;color:var(--ink-faint);
    background:transparent;border:none;padding:8px 22px;cursor:pointer;transition:.25s;}
  .tab.on{color:var(--glow);text-shadow:0 0 16px rgba(160,195,255,.5);}

  /* カレンダー（星空） */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 20px;}
  .cal-nav{background:transparent;border:1px solid var(--panel-line);color:var(--ink-dim);
    width:38px;height:38px;border-radius:12px;font-size:20px;line-height:1;cursor:pointer;transition:.2s;}
  .cal-nav:active{background:rgba(160,190,255,.14);}
  .cal-title{display:flex;align-items:center;gap:12px;font-family:var(--mincho);
    font-size:18px;letter-spacing:.12em;color:var(--ink);}
  .cal-moon{width:19px;height:19px;display:inline-flex;opacity:.9;
    filter:drop-shadow(0 0 6px rgba(232,222,170,.45));}
  .cal-moon svg{width:100%;height:100%;}
  .cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;}
  .cal-wd span{text-align:center;font-size:10px;letter-spacing:.08em;color:var(--ink-faint);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cell{position:relative;aspect-ratio:1/1;border-radius:12px;display:flex;
    align-items:center;justify-content:center;cursor:pointer;}
  .cell.pad{visibility:hidden;cursor:default;}
  .cell .moon{position:absolute;inset:0;margin:auto;width:58%;height:58%;opacity:.15;
    display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;}
  .cell .moon svg{width:100%;height:100%;display:block;}
  .cell .starglow{position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:50%;
    z-index:1;
    background:radial-gradient(circle,#f0f5ff 0%,var(--glow) 55%,rgba(207,224,255,0) 100%);
    opacity:calc(.5 + var(--g,0)*.5);
    box-shadow:0 0 calc(5px + var(--g,0)*9px) calc(1px + var(--g,0)*2px) rgba(188,210,255,.6),
               0 0 calc(11px + var(--g,0)*17px) calc(2px + var(--g,0)*4px) rgba(140,175,255,.28);}
  .cell.today .starglow{width:12px;height:12px;opacity:1;
    background:radial-gradient(circle,#ffffff 0%,#dbe8ff 45%,rgba(207,224,255,0) 100%);
    box-shadow:0 0 17px 3px rgba(200,220,255,.75),
               0 0 34px 7px rgba(150,185,255,.4);}
  .cell .num{position:relative;z-index:2;font-size:12px;color:var(--ink-faint);}
  .cell.rec .num,.cell.today .num{color:var(--void-0);font-weight:600;}
  .cell.today{outline:1px solid rgba(165,195,255,.4);outline-offset:-1px;}
  .cal-legend{text-align:center;margin-top:22px;font-size:11px;color:var(--ink-faint);
    letter-spacing:.2em;font-family:var(--mincho);}

  /* グラフ（きせき） */
  .g-range{display:flex;justify-content:center;gap:8px;margin:6px 0 18px;}
  .g-tab{font-family:var(--mincho);font-size:13px;letter-spacing:.18em;color:var(--ink-faint);
    background:transparent;border:1px solid var(--panel-line);border-radius:11px;
    padding:8px 20px;cursor:pointer;transition:.2s;}
  .g-tab.on{color:var(--void-0);background:var(--glow);border-color:var(--glow);
    box-shadow:0 0 16px rgba(160,195,255,.4);}
  .chart-wrap{position:relative;height:44vh;min-height:260px;
    background:rgba(10,13,32,.32);border:1px solid var(--panel-line);border-radius:18px;
    padding:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  #chart{width:100%;height:100%;display:block;}
  .g-legend{display:flex;justify-content:center;gap:20px;margin-top:14px;
    font-size:11px;color:var(--ink-dim);letter-spacing:.08em;}
  .g-legend .lg-line{color:var(--glow);}
  .g-legend .lg-bar{color:var(--glow-soft);}

  /* ===== セクション（自作ログ） ===== */
  .sec{background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;
    padding:18px 18px 20px;margin-top:14px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);}
  .sec.editing{outline:1px dashed rgba(150,170,240,.35);outline-offset:3px;}
  .sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sec-head .l{display:flex;align-items:baseline;gap:10px;min-width:0;}
  .sec-name{font-size:12px;letter-spacing:.24em;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sec-val{color:var(--glow);font-size:15px;letter-spacing:.06em;font-family:var(--mincho);}
  .sec-edit{background:transparent;border:none;color:var(--ink-faint);font-size:14px;
    cursor:pointer;padding:4px 4px;transition:.2s;flex:0 0 auto;}
  .sec-edit:active{color:var(--glow);}

  /* choice / amount / tally 共通のボタン下地 */
  .opt,.step{font-family:var(--sans);font-size:15px;color:var(--glow);width:100%;
    background:rgba(140,160,230,.06);border:1px solid var(--panel-line);
    border-radius:14px;padding:14px 4px;cursor:pointer;transition:.15s;letter-spacing:.02em;}
  .opt{font-size:14px;color:var(--ink-dim);}
  .opt:active,.step:active{transform:scale(.95);background:rgba(160,190,255,.16);}
  .opt.on{color:var(--void-0);background:var(--glow);border-color:var(--glow);
    box-shadow:0 0 20px rgba(160,195,255,.5);font-weight:600;}

  .choice,.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .choice{grid-template-columns:repeat(4,1fr);}
  .steps + .steps{margin-top:9px;}
  .pick{position:relative;}

  .amt-total{text-align:center;font-family:var(--mincho);margin-bottom:16px;}
  .amt-total .n{font-size:40px;color:var(--glow);letter-spacing:.02em;
    text-shadow:0 0 24px rgba(150,185,255,.4);}
  .amt-total .u{font-size:15px;color:var(--ink-dim);margin-left:4px;letter-spacing:.1em;}
  .amt-total .last{display:block;font-size:11px;color:var(--ink-faint);
    letter-spacing:.16em;margin-top:6px;font-family:var(--sans);min-height:14px;}

  /* menu：カテゴリ内のメニュー（種目）ごとに回数を記録 */
  .menu-item{padding:14px 0;border-bottom:1px solid rgba(120,140,220,.08);}
  .menu-item:last-of-type{border-bottom:none;}
  .menu-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px;}
  .menu-name{font-size:14px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .menu-total{font-family:var(--mincho);color:var(--glow);font-size:17px;flex:0 0 auto;
    text-shadow:0 0 12px rgba(150,185,255,.35);}
  .menu-total .u{font-size:11px;color:var(--ink-dim);margin-left:3px;letter-spacing:.08em;}
  .menu-steps{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
  .menu-steps .step{width:auto;flex:0 0 auto;padding:10px 13px;font-size:13px;}
  .menu-steps .pick{display:inline-block;}
  .step.ghost{color:var(--ink-dim);border-style:dashed;padding:10px 12px;font-size:12px;}
  .menu-minus{width:36px;height:36px;border-radius:11px;border:1px solid var(--panel-line);
    background:rgba(140,160,230,.06);color:var(--ink-dim);font-size:18px;line-height:1;cursor:pointer;flex:0 0 auto;transition:.15s;}
  .menu-minus:active{transform:scale(.9);}
  .menu-minus:disabled{opacity:.3;}
  .menu-edit{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .menu-edit button{font-size:11px;color:var(--ink-dim);background:transparent;
    border:1px solid var(--panel-line);border-radius:9px;padding:7px 11px;cursor:pointer;letter-spacing:.06em;}
  .menu-edit .danger{color:#bf5568;border-color:rgba(191,85,104,.3);}

  /* 削除バッジ（編集中のみ） */
  .del-x{display:none;position:absolute;top:-7px;right:-7px;width:19px;height:19px;
    border-radius:50%;background:#bf5568;color:#fff;font-size:11px;line-height:1;
    align-items:center;justify-content:center;border:none;cursor:pointer;z-index:4;}
  .editing .del-x{display:inline-flex;}
  .tally-del{display:none;background:transparent;border:none;color:#bf5568;font-size:15px;cursor:pointer;padding:4px;}
  .editing .tally-del{display:inline-block;}
  .add-item{width:100%;margin-top:10px;font-size:12px;color:var(--ink-dim);letter-spacing:.12em;
    background:transparent;border:1px dashed rgba(120,140,220,.25);border-radius:12px;padding:11px;cursor:pointer;}
  .sec-del{width:100%;margin-top:12px;font-size:12px;color:#bf5568;letter-spacing:.14em;
    background:transparent;border:1px solid rgba(191,85,104,.3);border-radius:12px;padding:11px;cursor:pointer;}

  .undo{width:100%;margin-top:10px;font-family:var(--sans);font-size:13px;color:var(--ink-faint);
    background:transparent;border:1px solid rgba(120,140,220,.1);border-radius:12px;
    padding:11px;cursor:pointer;letter-spacing:.14em;transition:.2s;}
  .undo:active{color:var(--ink-dim);}
  .undo:disabled{opacity:.35;}

  .add-section{width:100%;margin-top:16px;font-family:var(--mincho);font-size:13px;
    letter-spacing:.16em;color:var(--ink-dim);background:transparent;
    border:1px dashed rgba(120,140,220,.28);border-radius:16px;padding:16px;cursor:pointer;transition:.2s;}
  .add-section:active{background:rgba(140,160,230,.06);color:var(--glow);}
  .settings-link{display:block;margin:18px auto 0;font-family:var(--mincho);font-size:12px;
    letter-spacing:.18em;color:var(--ink-faint);background:transparent;border:none;
    cursor:pointer;transition:.2s;}
  .settings-link:active{color:var(--glow);}

  /* ===== モーダル ===== */
  .modal{position:fixed;inset:0;z-index:20;background:rgba(3,4,10,.74);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:none;align-items:flex-end;justify-content:center;}
  .modal.open{display:flex;}
  .sheet{width:100%;max-width:520px;background:linear-gradient(180deg,#0e1230,#0a0c1e);
    border:1px solid var(--panel-line);border-radius:22px 22px 0 0;
    padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);
    animation:sheetUp .28s ease;}
  @keyframes sheetUp{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}
  .sheet-title{font-family:var(--mincho);font-size:16px;letter-spacing:.14em;color:var(--ink);
    margin-bottom:20px;text-align:center;}
  .fld{display:block;font-size:11px;letter-spacing:.18em;color:var(--ink-faint);margin-bottom:16px;}
  .fld input{display:block;width:100%;margin-top:8px;background:rgba(140,160,230,.06);
    border:1px solid var(--panel-line);border-radius:12px;padding:13px;color:var(--ink);
    font-size:16px;font-family:var(--sans);letter-spacing:normal;}
  .fld input::placeholder{color:var(--ink-faint);}
  .fld-err{display:none;margin-top:8px;font-size:11px;color:#e08196;letter-spacing:.08em;}
  .fld-err.on{display:block;}
  .type-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
  .type-pick button{font-size:12px;color:var(--ink-dim);background:rgba(140,160,230,.05);
    border:1px solid var(--panel-line);border-radius:11px;padding:12px 4px;cursor:pointer;letter-spacing:.02em;}
  .type-pick button.on{color:var(--void-0);background:var(--glow);border-color:var(--glow);font-weight:600;}
  .type-hint{margin-top:9px;font-size:11px;color:var(--ink-faint);letter-spacing:.04em;line-height:1.5;}
  .sheet-btns{display:flex;gap:10px;margin-top:6px;}
  .btn-ghost{flex:1;background:transparent;border:1px solid var(--panel-line);color:var(--ink-dim);

<script>
"use strict";
/* ================= データ層（完全ローカル） ================= */
const KEY="evolog.v1";
function uid(){ return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* 既定セクション（初回のみ）。以後は自由に追加・削除・編集できる */
function defaultConfig(){
  return { sections:[
    { id:"mood", name:"今日の体調", type:"choice", role:"mood",
      options:["元気","普通","疲れ気味","悪い"],
      scoreMap:{"元気":100,"普通":70,"疲れ気味":40,"悪い":20} },
    { id:"water", name:"水分", type:"amount", unit:"mL",
      steps:[50,100,150,200,250,300] }
  ], wishes:[] };
}

function load(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s||typeof s!=="object") s={};
  if(!s.days) s.days={};
  if(!s.config||!Array.isArray(s.config.sections)) s.config=defaultConfig();
  migrate(s);
  return s;
}
/* 旧形式 {mood, water:[{amount,time}]} → logs 形式へ移行。旧 tally → menu へ */
function migrate(s){
  for(const k in s.days){
    const d=s.days[k];
    if(d && !d.logs){
      const logs={};
      if(d.mood) logs.mood={sel:d.mood};
      if(Array.isArray(d.water)&&d.water.length)
        logs.water={entries:d.water.map(w=>({v:w.amount,t:w.time}))};
      s.days[k]={logs};
    }
  }
  for(const sec of s.config.sections){
    if(sec.type==="tally"){
      sec.type="menu";
      sec.items=(sec.items||[]).map(it=>({id:it.id,label:it.label,unit:sec.unit||"回",steps:[1]}));
      for(const k in s.days){
        const lg=s.days[k].logs&&s.days[k].logs[sec.id];
        if(lg&&lg.entries) lg.entries.forEach(e=>{ if(e.v==null) e.v=1; });
      }
      delete sec.unit;
    }
  }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function dayKey(d=new Date()){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function nowHM(){
  const d=new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

let state=load();
const TODAY=dayKey();
function today(){
  if(!state.days[TODAY]) state.days[TODAY]={logs:{}};
  if(!state.days[TODAY].logs) state.days[TODAY].logs={};
  return state.days[TODAY];
}
function sections(){ return state.config.sections; }
function sectionById(id){ return sections().find(s=>s.id===id); }
function logOf(rec, sec){
  if(!rec.logs) rec.logs={};
  if(!rec.logs[sec.id]) rec.logs[sec.id]= sec.type==="choice" ? {sel:null} : {entries:[]};
  return rec.logs[sec.id];
}

/* その日が「記録済み」か：どれか1つでも入力があれば（消したセクションの記録も尊重） */
function logHasData(lg){ return !!(lg && (lg.sel || (lg.entries&&lg.entries.length))); }
function isRecorded(rec){
  if(!rec||!rec.logs) return false;
  for(const id in rec.logs){ if(logHasData(rec.logs[id])) return true; }
  return false;
}
/* 体調（role:mood のセクション）の値とスコア */
function moodValueOf(rec){
  const sec=sections().find(s=>s.role==="mood");
  const lg=rec.logs&&rec.logs[sec?sec.id:"mood"];
  return lg?lg.sel:null;
}
function moodScoreOf(rec){
  const sec=sections().find(s=>s.role==="mood");
  const v=moodValueOf(rec);
  return (sec&&sec.scoreMap&&v!=null)?(sec.scoreMap[v]||0):0;
}

/* 連続記録日数：今日から遡って、記録のある日が続く数
   （今日まだ未記録でも、昨日までの連続は保持する＝責めない設計） */
function streakCount(){
  let n=0;
  const start=new Date();
  if(!isRecorded(state.days[TODAY])) start.setDate(start.getDate()-1);
  for(let i=0;i<1000;i++){
    const k=dayKey(start);
    if(isRecorded(state.days[k])){ n++; start.setDate(start.getDate()-1); }
    else break;
  }
  return n;
}

/* 累計経験値：記録した日ごとに 基礎10 ＋ 体調スコア×0.05（最大+5） */
function dayExp(rec){
  if(!isRecorded(rec)) return 0;
  return 10 + Math.min(moodScoreOf(rec)*0.05,5);
}
function totalExp(){
  let e=0;
  for(const k in state.days) e+=dayExp(state.days[k]);
  return e;
}

/* 光のパラメータ：大きさ=積み重ね(exp) / 色段階=月ペース / 明るさ=今日＋勢い */
function lightParams(){
  const exp=totalExp();
  const streak=streakCount();
  const recorded=isRecorded(state.days[TODAY]);
  // 大きさ：1年(≈exp4500)で 0.55→2.05 まで、ゆるやかに。積み重ねは縮まない。
  const size=0.55 + Math.min(exp/4500,1)*1.5;
  // 色段階：おおよそ月1色ペース（≈375expで+1）、上限12。最初は青白の単色。
  const colorStage=Math.min(1+Math.floor(exp/375),12);
  // 明るさ：土台＋今日記録＋連続の勢い（上限あり）
  const bright=0.34 + (recorded?0.30:0) + Math.min(streak*0.02,0.34);
  return {size,colorStage,bright,streak,recorded,exp};
}

function biorhythm(birthStr, date){
  const p=birthStr.split("-").map(Number), birth=new Date(p[0],p[1]-1,p[2]);
  const days=Math.floor((date-birth)/86400000);
  const phys=Math.sin(2*Math.PI*days/23), emo=Math.sin(2*Math.PI*days/28), intel=Math.sin(2*Math.PI*days/33);
  return {phys,emo,intel, avg:(phys+emo+intel)/3};
}
function sunSign(m,d){
  const cut=[20,19,21,20,21,21,23,23,23,23,22,22];
  const names=[["♑","山羊座"],["♒","水瓶座"],["♓","魚座"],["♈","牡羊座"],["♉","牡牛座"],["♊","双子座"],["♋","蟹座"],["♌","獅子座"],["♍","乙女座"],["♎","天秤座"],["♏","蠍座"],["♐","射手座"],["♑","山羊座"]];
  const i = d < cut[m-1] ? m-1 : m;
  return {e:names[i][0], j:names[i][1]};
}

  const q=QUOTES[((doy%QUOTES.length)+QUOTES.length)%QUOTES.length];
  return {en:q.en, ja:q.ja, who:"— "+q.who};
}
function starlightData(){
  const now=new Date();
  const doy=Math.floor((now - new Date(now.getFullYear(),0,0))/86400000);
  const b=biorhythm(state.config.birth, now);
  const phase = b.avg>=0.3?"high":(b.avg<=-0.3?"gentle":"steady");
  const p=state.config.birth.split("-").map(Number), sg=sunSign(p[1],p[2]);
  const pw = phase==="high"?"高まる日":(phase==="gentle"?"やわらぐ日":"整う日");
  const pool=AFFIRM[phase], a=pool[doy % pool.length];
  return {en:a.en, ja:a.ja, who:"☽ "+sg.e+" "+sg.j+" ・ "+pw};
}
/* 句読点・センテンスの切れ目で優先的に折り返す（変な位置で切れないように） */
function phrasify(text){
  const isCJK=/[\u3040-\u30ff\u4e00-\u9fff]/.test(text);
  const marked = isCJK
    ? text.replace(/([、。・！？])/g,"$1\n")
    : text.replace(/([,.;:!?])\s+/g,"$1\n");
  const parts=marked.split("\n").map(s=>s.trim()).filter(Boolean);
  if(parts.length<=1) return esc(text);          // 内部に区切りが無ければ自然折り返し
  const sep = isCJK ? "<wbr>" : " ";
  const limit = isCJK ? 14 : 24;                  // これより長い塊だけ内部でも折る
  return parts.map(p=>'<span class="ph'+(p.length>limit?" long":"")+'">'+esc(p)+"</span>").join(sep);
}

}
function clampIdx(n,len){ return Math.max(0,Math.min(len-1,n)); }
function subLine(t){ return '<span class="sub">'+phrasify(t)+'</span>'; }
function whoLine(t){ return '<span class="who">'+esc(t)+'</span>'; }

function renderVoice(){
  const pages=voicePages();
  voiceIdx=clampIdx(voiceIdx,pages.length);
  const pg=pages[voiceIdx];
  const el=document.getElementById("voice");
  el.style.animation="none"; void el.offsetWidth; el.style.animation="";
  el.className="voice";
  let html="";
  if(pg.t==="wisdom"){
    const d=quoteData(); html=phrasify(d.en)+subLine(d.ja)+whoLine(d.who);
  } else if(pg.t==="starlight"){
    if(state.config.birth){ const d=starlightData(); html=phrasify(d.en)+subLine(d.ja)+whoLine(d.who); }
    else { html='<span class="invite">☽ 誕生日を設定すると、<br>星の声が届きます。</span>'; }
  } else if(pg.t==="wish"){
    const w=wishes()[pg.i];
    if(w.done) el.className="voice fulfilled";
    html=phrasify(w.text)+whoLine(w.done?"★ 叶えた願い":"☆ 願い");
  } else {
    html='<span class="invite">＋ 願いを掲げる</span>';
  }
  el.innerHTML=html;
  renderActions(pg);
  renderDots(pages);
}
function renderActions(pg){

  const w=wishes()[pg.i];
  box.innerHTML = w.done
    ? '<button data-wa="undone">戻す</button><button data-wa="del">削除</button>'
    : '<button data-wa="edit">編集</button><button data-wa="done">叶えた</button><button data-wa="del">削除</button>';

function menuTotal(lg,itemId){ return (lg&&lg.entries?lg.entries:[]).filter(e=>e.item===itemId).reduce((a,e)=>a+(+e.v||0),0); }

}

      ).join("");
      return '<div class="menu-item"><div class="menu-top">'
        +'<span class="menu-name">'+esc(it.label)+'</span>'
        +'<span class="menu-total">'+tot+'<span class="u">'+esc(it.unit||"")+'</span></span></div>'
        +'<div class="menu-steps">'
        +'<button class="menu-minus" data-act="mundo" data-sec="'+sec.id+'" data-item="'+it.id+'"'+(cnt?'':' disabled')+'>−</button>'
        +steps
        +(ed?'<button class="step ghost" data-act="maddstep" data-sec="'+sec.id+'" data-item="'+it.id+'">＋回数</button>':'')
        +'</div>'
        +(ed?'<div class="menu-edit"><button data-act="renmenu" data-sec="'+sec.id+'" data-item="'+it.id+'">名前</button>'
           +'<button data-act="unitmenu" data-sec="'+sec.id+'" data-item="'+it.id+'">単位</button>'
           +'<button class="danger" data-act="delmenu" data-sec="'+sec.id+'" data-item="'+it.id+'">削除</button></div>':'')
        +'</div>';
    }).join("")
    +(ed?'<button class="add-item" data-act="addmenu" data-sec="'+sec.id+'">＋ メニューを追加</button>':'');
  }
  const head='<div class="sec-head"><div class="l"><span class="sec-name">'+esc(sec.name)+'</span>'
    +'<span class="sec-val">'+headVal(sec,lg)+'</span></div>'
    +'<button class="sec-edit" data-act="edit" data-sec="'+sec.id+'">'+(ed?'完了':'編集')+'</button></div>';
  const foot=ed?('<button class="add-item" data-act="rename" data-sec="'+sec.id+'">名前を変更</button>'
    +'<button class="sec-del" data-act="delsec" data-sec="'+sec.id+'">このセクションを削除</button>'):'';
  return '<div class="sec'+(ed?' editing':'')+'">'+head+body+foot+'</div>';
}

document.getElementById("sections").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.sec;
  if(act==="edit"){ editing[id]=!editing[id]; renderSections(); return; }
  const sec=sectionById(id); if(!sec) return;
  const rec=today();

  // --- 記録 ---
  if(act==="choice"){ const lg=logOf(rec,sec); const o=b.dataset.op; lg.sel=(lg.sel===o)?null:o; afterChange(); return; }
  if(act==="add"){ logOf(rec,sec).entries.push({v:parseFloat(b.dataset.v),t:nowHM()}); afterChange(); return; }
  if(act==="undo"){ logOf(rec,sec).entries.pop(); afterChange(); return; }
  if(act==="madd"){ logOf(rec,sec).entries.push({item:b.dataset.item,v:parseFloat(b.dataset.v),t:nowHM()}); afterChange(); return; }
  if(act==="mundo"){ const es=logOf(rec,sec).entries; for(let i=es.length-1;i>=0;i--){ if(es[i].item===b.dataset.item){ es.splice(i,1); break; } } afterChange(); return; }

  // --- 構成の編集 ---
  const item=()=>sec.items.find(x=>x.id===b.dataset.item);
  if(act==="delstep"){ sec.steps=sec.steps.filter(v=>String(v)!==b.dataset.v); afterChange(); return; }
  if(act==="delopt"){ sec.options=sec.options.filter(o=>o!==b.dataset.op); if(sec.scoreMap) delete sec.scoreMap[b.dataset.op]; afterChange(); return; }
  if(act==="addstep"){ askInput("ボタンを追加",{label:"数値",placeholder:"例：200",numeric:true},v=>{ const n=parseFloat(v); if(!isNaN(n)&&n>0&&!sec.steps.includes(n)){ sec.steps.push(n); sec.steps.sort((a,b)=>a-b); afterChange(); } }); return; }
  if(act==="addopt"){ askInput("選択肢を追加",{placeholder:"例：最高"},v=>{ v=(v||"").trim(); if(v&&!sec.options.includes(v)){ sec.options.push(v); afterChange(); } }); return; }
  if(act==="addmenu"){ askInput("メニューを追加",{label:"メニュー名",placeholder:"例：スクワット"},v=>{ v=(v||"").trim(); if(v){ sec.items.push({id:uid(),label:v,unit:"回",steps:[1,10]}); afterChange(); } }); return; }
  if(act==="delmenu"){ const it=item(); if(it) askConfirm("「"+it.label+"」を削除しますか？",()=>{ sec.items=sec.items.filter(x=>x.id!==b.dataset.item); afterChange(); }); return; }
  if(act==="renmenu"){ const it=item(); if(it) askInput("メニュー名を変更",{value:it.label},v=>{ v=(v||"").trim(); if(v){ it.label=v; afterChange(); } }); return; }
  if(act==="unitmenu"){ const it=item(); if(it) askInput("単位を変更",{value:it.unit||"回",placeholder:"例：回／秒"},v=>{ v=(v||"").trim(); if(v){ it.unit=v; afterChange(); } }); return; }
  if(act==="maddstep"){ const it=item(); if(it) askInput("回数を追加",{label:"数値",placeholder:"例：20",numeric:true},v=>{ const n=parseFloat(v); if(!isNaN(n)&&n>0){ it.steps=it.steps||[]; if(!it.steps.includes(n)){ it.steps.push(n); it.steps.sort((a,b)=>a-b); afterChange(); } } }); return; }
  if(act==="mdelstep"){ const it=item(); if(it&&it.steps){ it.steps=it.steps.filter(v=>String(v)!==b.dataset.v); } afterChange(); return; }
  if(act==="rename"){ askInput("名前を変更",{value:sec.name},v=>{ v=(v||"").trim(); if(v){ sec.name=v; afterChange(); } }); return; }
  if(act==="delsec"){ askConfirm("「"+sec.name+"」を削除しますか？（記録は残ります）",()=>{ state.config.sections=sections().filter(s=>s.id!==id); delete editing[id]; afterChange(); }); return; }
});

/* ================= 光のモヤ（Canvas） ================= */
const sky=document.getElementById("sky");
const sctx=sky.getContext("2d");
let W,H,DPR,cx,cy,baseR;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* 青白を核に、段階で増えていく色の層（青白→藍→紫→菫→青緑…） */
const PALETTE=[
  [207,224,255], // 1 青白（核）
  [150,180,255], // 2 青
  [130,150,245], // 3 藍
  [169,156,255], // 4 紫
  [190,150,240], // 5 菫
  [130,200,235], // 6 青緑
  [120,165,255], // 7
  [200,170,255], // 8
  [150,215,220], // 9
  [175,160,250], // 10
  [140,190,255], // 11
  [210,220,255]  // 12
];

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=sky.width=innerWidth*DPR; H=sky.height=innerHeight*DPR;
  sky.style.width=innerWidth+"px"; sky.style.height=innerHeight+"px";
  cx=W/2; cy=H*0.30;                 // 光の中心は上部ヒーロー帯のあたり
  baseR=Math.min(W,H)*0.16;
  drawDust();
}
addEventListener("resize",resize);

function glow(x,y,r,rgb,a){
  const g=sctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,   "rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+a+")");
  g.addColorStop(0.35,"rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+(a*0.30)+")");
  g.addColorStop(1,   "rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+",0)");
  sctx.fillStyle=g; sctx.beginPath(); sctx.arc(x,y,r,0,Math.PI*2); sctx.fill();
}

/* 漂う光の粒 */
const motes=[];
for(let i=0;i<26;i++){
  motes.push({a:Math.random()*Math.PI*2, rad:Math.random(), sp:0.2+Math.random()*0.5,
              ph:Math.random()*Math.PI*2, sz:0.4+Math.random()*0.8});
}

/* 目標値へなめらかに寄せる（タップ時に光がふっと応える） */
let curBright=0.34, curScale=0.55;
function pulse(){ /* 描画ループが lightParams を毎フレーム読むので即応する */ }

function frame(t){
  const p=lightParams();
  curBright += (p.bright-curBright)*0.06;
  curScale  += (p.size -curScale )*0.05;
  const breathe = reduce ? 1 : 1+Math.sin(t*0.0011)*0.06;   // ゆっくりした呼吸
  const R=baseR*curScale*breathe*DPR/DPR;

  sctx.clearRect(0,0,W,H);
  sctx.globalCompositeOperation="lighter";

  // 核：青白いモヤ（二重に重ねて濃淡）
  glow(cx,cy,R*3.4, PALETTE[0], curBright*0.16*breathe);
  glow(cx,cy,R*1.7, PALETTE[0], curBright*0.34*breathe);
  glow(cx,cy,R*0.8, PALETTE[0], curBright*0.42*breathe);

  // 色の層：段階が上がるほど、別の色が周囲にそっと足される
  for(let i=1;i<p.colorStage;i++){
    const ang=t*0.0002*(i%2?1:-1) + i*(Math.PI*2/6);
    const dist=R*(1.0+0.25*i);
    const bx=cx+Math.cos(ang)*dist*0.5;
    const by=cy+Math.sin(ang)*dist*0.5;
    glow(bx,by,R*1.5, PALETTE[i%PALETTE.length], curBright*0.14*breathe);
  }

  // 漂う粒
  for(const m of motes){
    const drift = reduce ? 0 : t*0.00006*m.sp;
    const ang=m.a+drift;
    const rr=(0.4+m.rad*2.2)*R;
    const x=cx+Math.cos(ang)*rr;
    const y=cy+Math.sin(ang*0.8+m.ph)*rr*0.7 - (reduce?0:Math.sin(t*0.0004+m.ph)*R*0.15);
    const tw=0.5+0.5*Math.sin(t*0.001+m.ph);
    glow(x,y,R*0.13*m.sz, PALETTE[0], curBright*0.5*tw*0.5);
  }

  sctx.globalCompositeOperation="source-over";
  drawStars(t);
  requestAnimationFrame(frame);
}

/* 夜空の星野：瞬き＋願いの星座（夏の大三角）＋ごく稀な流れ星（さりげなく） */
const dust=document.getElementById("dust");
const dctx=dust.getContext("2d");
let stars=[], tri=[];
function initStars(){
  dust.width=innerWidth*DPR; dust.height=innerHeight*DPR;
  dust.style.width=innerWidth+"px"; dust.style.height=innerHeight+"px";
  const n=Math.round(innerWidth*innerHeight/5200);
  stars=[];
  for(let i=0;i<n;i++){
    const warm=Math.random()<0.16;
    const tw=Math.random()<0.5;                     // 半分ほどが瞬く
    stars.push({
      x:Math.random()*dust.width,
      y:Math.random()*dust.height,
      r:(Math.random()*Math.random()*1.0+0.25)*DPR,
      baseA:(tw?0.10:0.04)+Math.random()*0.20,      // 瞬く星は少し明るめ
      col: warm ? "236,228,196" : "188,206,255",
      twinkle: tw,
      sp:0.0009+Math.random()*0.0022,               // 少し速く＝気づける
      ph:Math.random()*Math.PI*2
    });
  }
  // 夏の大三角（右上に。ベガ・デネブ・アルタイルのイメージ）
  tri=[[0.73,0.15],[0.88,0.27],[0.66,0.34]].map(p=>({
    x:p[0]*dust.width, y:p[1]*dust.height, ph:Math.random()*Math.PI*2
  }));
}
let shoot=null, nextShoot=7000;   // 最初の流れ星は7秒後あたり
function drawStars(t){
  dctx.clearRect(0,0,dust.width,dust.height);
  dctx.globalCompositeOperation="lighter";

  // 散らばる星
  for(const s of stars){
    const tw=(s.twinkle&&!reduce)?(0.35+0.65*(0.5+0.5*Math.sin(t*s.sp+s.ph))):1;
    dctx.fillStyle="rgba("+s.col+","+(s.baseA*tw).toFixed(3)+")";
    dctx.beginPath(); dctx.arc(s.x,s.y,s.r,0,Math.PI*2); dctx.fill();
  }

  // 願いの星座：結ぶ線（ごく淡く）
  dctx.strokeStyle="rgba(232,226,190,0.09)";
  dctx.lineWidth=1*DPR;
  dctx.beginPath();
  dctx.moveTo(tri[0].x,tri[0].y);
  dctx.lineTo(tri[1].x,tri[1].y);
  dctx.lineTo(tri[2].x,tri[2].y);
  dctx.closePath(); dctx.stroke();
  // 三つの星（暖色で少し明るく、静かに瞬く）
  for(const s of tri){
    const tw=0.72+0.28*Math.sin(t*0.0016+s.ph);
    const g=dctx.createRadialGradient(s.x,s.y,0,s.x,s.y,7*DPR);
    g.addColorStop(0,"rgba(242,238,208,"+(0.5*tw).toFixed(2)+")");
    g.addColorStop(1,"rgba(242,238,208,0)");
    dctx.fillStyle=g; dctx.beginPath(); dctx.arc(s.x,s.y,7*DPR,0,Math.PI*2); dctx.fill();
    dctx.fillStyle="rgba(246,243,222,"+(0.75*tw).toFixed(2)+")";
    dctx.beginPath(); dctx.arc(s.x,s.y,1.4*DPR,0,Math.PI*2); dctx.fill();
  }

  // 流れ星：右斜め上へ、グラフが上がるように（願いをかける間もある短さ）
  if(!shoot && t>nextShoot && !reduce){
    const ang=0.46+Math.random()*0.26;              // 水平から約26〜41度、上向き
    shoot={t0:t, dur:950+Math.random()*500,
      x:dust.width*(0.04+Math.random()*0.42),
      y:dust.height*(0.62+Math.random()*0.30),
      vx:Math.cos(ang), vy:-Math.sin(ang),          // 右上がり
      dist:dust.width*(0.5+Math.random()*0.25)};
    nextShoot=t + (18000+Math.random()*24000);
  }
  if(shoot){
    const p=(t-shoot.t0)/shoot.dur;
    if(p>=1){ shoot=null; }
    else{
      const hx=shoot.x+shoot.vx*shoot.dist*p, hy=shoot.y+shoot.vy*shoot.dist*p;
      const tl=shoot.dist*0.20;
      const txx=hx-shoot.vx*tl, tyy=hy-shoot.vy*tl;
      const a=Math.sin(Math.PI*p)*0.85;
      const grad=dctx.createLinearGradient(txx,tyy,hx,hy);
      grad.addColorStop(0,"rgba(205,218,255,0)");
      grad.addColorStop(1,"rgba(236,241,255,"+a.toFixed(2)+")");
      dctx.strokeStyle=grad; dctx.lineWidth=1.5*DPR; dctx.lineCap="round";
      dctx.beginPath(); dctx.moveTo(txx,tyy); dctx.lineTo(hx,hy); dctx.stroke();
      dctx.fillStyle="rgba(240,244,255,"+a.toFixed(2)+")";
      dctx.beginPath(); dctx.arc(hx,hy,1.6*DPR,0,Math.PI*2); dctx.fill();
    }
  }

  dctx.globalCompositeOperation="source-over";
}
function drawDust(){ initStars(); }  // resize から呼ばれる

/* ================= 月の満ち欠け ================= */
// 既知の新月(2000-01-06 18:14 UTC)からの経過で位相 p を求める（0=新月, 0.5=満月）
function moonPhase(date){
  const synodic=29.53058867;
  const ref=Date.UTC(2000,0,6,18,14,0)/86400000;
  const now=date.getTime()/86400000;
  let p=((now-ref)/synodic)%1;
  return p<0?p+1:p;
}
// 位相からSVGの「光っている部分」を描く（新月は闇＝ほぼ不可視、さりげなく）
function moonSVG(p,S){
  const R=S/2, cx=R;
  const rx=Math.abs(Math.cos(2*Math.PI*p))*R;
  const waxing=p<0.5, gibbous=(p>0.25&&p<0.75);
  const sweepOuter=waxing?1:0;
  const sweepInner=waxing?(gibbous?1:0):(gibbous?0:1);
  const d="M "+cx+" 0 A "+R+" "+R+" 0 0 "+sweepOuter+" "+cx+" "+S
        +" A "+rx.toFixed(2)+" "+R+" 0 0 "+sweepInner+" "+cx+" 0 Z";
  return '<svg viewBox="0 0 '+S+' '+S+'"><path d="'+d+'" fill="#e7e0c0"/></svg>';
}

/* ================= カレンダー（星空） ================= */
let calY=new Date().getFullYear(), calM=new Date().getMonth();
function renderCal(){
  const startWd=new Date(calY,calM,1).getDay();
  const days=new Date(calY,calM+1,0).getDate();
  document.getElementById("cal-month").textContent=calY+"年 "+(calM+1)+"月";
  document.getElementById("cal-moon").innerHTML=moonSVG(moonPhase(new Date()),100);
  let html="";
  for(let i=0;i<startWd;i++) html+='<div class="cell pad"></div>';
  for(let d=1;d<=days;d++){
    const dt=new Date(calY,calM,d), k=dayKey(dt), rec=state.days[k];
    const on=isRecorded(rec);
    const g=on?(dayExp(rec)-10)/5:0;
    const cls="cell"+(on?" rec":"")+(k===TODAY?" today":"");
    html+='<div class="'+cls+'" data-k="'+k+'" style="--g:'+g.toFixed(2)+'">'
        + '<span class="moon">'+moonSVG(moonPhase(dt),100)+'</span>'
        + ((on||k===TODAY)?'<span class="starglow"></span>':'')
        + '<span class="num">'+d+'</span></div>';
  }
  document.getElementById("cal-grid").innerHTML=html;
}

  if(--calM<0){calM=11;calY--;} renderCal();
});

const dayModal=document.getElementById("day");
function timeSort(a,b){ return (a.t||"")<(b.t||"")?-1:1; }
function dayDetailHTML(k){
  const rec=state.days[k];
  if(!isRecorded(rec)) return '<div class="day-empty">記録はありません。<small>空白も、休息のうち。</small></div>';
  const logs=rec.logs;
  const order=[];
  sections().forEach(s=>{ if(logs[s.id]) order.push(s.id); });
  for(const id in logs){ if(order.indexOf(id)<0) order.push(id); }

  let html="";
  for(const id of order){
    const lg=logs[id]; if(!logHasData(lg)) continue;
    const sec=sectionById(id);
    const name=sec?sec.name:"（削除されたセクション）";
    let inner="";
    if(lg.sel){
      inner='<div class="d-choice">'+esc(lg.sel)+'</div>';
    } else if(lg.entries&&lg.entries.length){
      const hasItem=lg.entries.some(e=>e.item);
      if(hasItem){
        const groups={};
        lg.entries.forEach(e=>{ (groups[e.item]=groups[e.item]||[]).push(e); });
        for(const itId in groups){
          const it=(sec&&sec.items)?sec.items.find(x=>x.id===itId):null;
          const label=it?it.label:"（不明な項目）";
          const unit=it?(it.unit||""):"";
          const es=groups[itId].slice().sort(timeSort);
          const tot=es.reduce((a,e)=>a+(+e.v||0),0);
          inner+='<div class="d-row"><span class="d-name">'+esc(label)+'</span><span class="d-tot">'+tot+' '+esc(unit)+'</span></div>';
          inner+='<div class="d-times">'+es.map(e=>'<span>'+(e.t||"")+'　+'+e.v+'</span>').join("")+'</div>';
        }
      } else {
        const es=lg.entries.slice().sort(timeSort);
        const unit=sec?(sec.unit||""):"";
        const tot=es.reduce((a,e)=>a+(+e.v||0),0);
        inner+='<div class="d-row"><span class="d-name">合計</span><span class="d-tot">'+tot+' '+esc(unit)+'</span></div>';
        inner+='<div class="d-times">'+es.map(e=>'<span>'+(e.t||"")+'　+'+e.v+'</span>').join("")+'</div>';
      }
    }
    html+='<div class="d-sec"><div class="d-sec-name">'+esc(name)+'</div>'+inner+'</div>';
  }
  return html;
}
function openDay(k){
  const p=k.split("-").map(Number), dt=new Date(p[0],p[1]-1,p[2]);
  const wd=["日","月","火","水","木","金","土"][dt.getDay()];
  document.getElementById("day-moon").innerHTML=moonSVG(moonPhase(dt),100);
  document.getElementById("day-date").textContent=p[1]+"月"+p[2]+"日（"+wd+"）";
  document.getElementById("day-body").innerHTML=dayDetailHTML(k);
  dayModal.classList.add("open");
}
function closeDay(){ dayModal.classList.remove("open"); }
document.getElementById("cal-grid").addEventListener("click",e=>{
  const c=e.target.closest(".cell"); if(!c||c.classList.contains("pad")) return;

});
document.getElementById("day-close").addEventListener("click",closeDay);
dayModal.addEventListener("click",e=>{ if(e.target===dayModal) closeDay(); });

  save(); closeSettings();
  if(state.config.birth && !had) voiceIdx=1;              // 設定した直後は星の声（Starlight）を見せる
  if(!state.config.birth && voiceIdx===1) voiceIdx=0;    // 誕生日を消してStarlight表示中ならWisdomへ
  renderVoice();
});

document.getElementById("s-export").addEventListener("click",()=>{

    const url=URL.createObjectURL(blob);

    a.href=url; a.download="astralog-backup-"+dayKey()+".json";

/* ---- バックアップ：読み込み（完全置き換え） ---- */
document.getElementById("s-import").addEventListener("click",()=>{
  document.getElementById("s-file").click();
});
document.getElementById("s-file").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value="";                 // 同じファイルを再選択できるようにリセット
  if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let obj=null;
    try{ obj=JSON.parse(reader.result); }catch(err){ obj=null; }
    const valid = obj && typeof obj==="object" && obj.days && typeof obj.days==="object"
                  && obj.config && Array.isArray(obj.config.sections);
    if(!valid){ askConfirm("このファイルは、AstraLog のバックアップとして読み込めませんでした。",function(){}); return; }
    const n=Object.keys(obj.days).length;
    askConfirm("読み込むと、今のデータはこのファイルで置き換わります。（記録 "+n+" 日分）よろしいですか？",()=>{
      migrate(obj);                    // 念のため旧形式も整える
      state=obj;
      save();
      voiceIdx=0;
      renderAll();
      closeSettings();
    });
  };
  reader.readAsText(f);
});

/* ================= グラフ（きせき） ================= */
const chartCanvas=document.getElementById("chart");
const cctx=chartCanvas.getContext("2d");
let chartRange="month", chartSeries=[], chartGeo=null;

function buildSeries(range){
  const out=[], now=new Date();
  if(range==="year"){
    for(let i=11;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const y=d.getFullYear(),m=d.getMonth(), days=new Date(y,m+1,0).getDate();
      let sum=0;
      for(let dd=1;dd<=days;dd++) sum+=dayExp(state.days[dayKey(new Date(y,m,dd))]);
      out.push({label:(m+1)+"月", exp:sum, k:null});
    }
  } else {
    const n=range==="week"?7:30;
    for(let i=n-1;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i), k=dayKey(d);
      out.push({label:(d.getMonth()+1)+"/"+d.getDate(), exp:dayExp(state.days[k]), k:k});
    }
  }
  let c=0; out.forEach(o=>{ c+=o.exp; o.cum=c; });
  return out;
}
function roundTop(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h); ctx.beginPath();
  ctx.moveTo(x,y+h); ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h); ctx.closePath();
}
function drawChart(){
  const cw=chartCanvas.clientWidth||300, ch=chartCanvas.clientHeight||260;
  chartCanvas.width=cw*DPR; chartCanvas.height=ch*DPR;
  cctx.setTransform(DPR,0,0,DPR,0,0);
  cctx.clearRect(0,0,cw,ch);
  const padL=10,padR=10,padT=16,padB=24;
  const W=cw-padL-padR, H=ch-padT-padB, n=chartSeries.length;
  if(!n) return;
  const maxCum=Math.max(1,...chartSeries.map(s=>s.cum));
  const maxDaily=Math.max(15,...chartSeries.map(s=>s.exp));
  const slot=W/n, barW=Math.min(slot*0.62,22);

  // 棒：積み上げ経験値（右上へ伸びる階段）
  chartSeries.forEach((s,i)=>{
    const x=padL+slot*(i+0.5), bh=H*(s.cum/maxCum), y=padT+H-bh;
    const grad=cctx.createLinearGradient(0,y,0,padT+H);
    grad.addColorStop(0,"rgba(150,180,255,0.45)");
    grad.addColorStop(1,"rgba(110,140,235,0.04)");
    cctx.fillStyle=grad; roundTop(cctx,x-barW/2,y,barW,bh,3); cctx.fill();
    cctx.fillStyle="rgba(200,220,255,0.8)"; cctx.fillRect(x-barW/2,y,barW,1.4);
  });

  // 折れ線：その日の経験値（光る糸）
  cctx.lineWidth=1.7; cctx.lineJoin="round";
  cctx.strokeStyle="rgba(214,228,255,0.9)";
  cctx.shadowColor="rgba(150,185,255,0.85)"; cctx.shadowBlur=9;
  cctx.beginPath();
  chartSeries.forEach((s,i)=>{ const x=padL+slot*(i+0.5), y=padT+H-H*(s.exp/maxDaily); i?cctx.lineTo(x,y):cctx.moveTo(x,y); });
  cctx.stroke(); cctx.shadowBlur=0;
  // 各日の星
  chartSeries.forEach((s,i)=>{
    const x=padL+slot*(i+0.5), y=padT+H-H*(s.exp/maxDaily);
    cctx.fillStyle= s.exp>0 ? "rgba(232,241,255,0.95)" : "rgba(120,140,190,0.5)";
    cctx.beginPath(); cctx.arc(x,y,s.exp>0?2.4:1.5,0,Math.PI*2); cctx.fill();
  });

  // x軸ラベル（間引き）
  cctx.fillStyle="rgba(125,140,185,0.9)"; cctx.font="10px -apple-system,sans-serif"; cctx.textAlign="center";
  const step=Math.max(1,Math.ceil(n/6));
  chartSeries.forEach((s,i)=>{ if(i%step===0||i===n-1) cctx.fillText(s.label, padL+slot*(i+0.5), ch-8); });

  chartGeo={padL,slot,n};
}
function renderChart(){ chartSeries=buildSeries(chartRange); drawChart(); }

document.querySelectorAll(".g-tab").forEach(t=>{
  t.addEventListener("click",()=>{
    chartRange=t.dataset.range;
    document.querySelectorAll(".g-tab").forEach(x=>x.classList.toggle("on",x===t));
    renderChart();
  });
});
chartCanvas.addEventListener("click",e=>{
  if(!chartGeo) return;
  const rect=chartCanvas.getBoundingClientRect();
  const i=Math.floor((e.clientX-rect.left-chartGeo.padL)/chartGeo.slot);
  const s=chartSeries[i];
  if(s&&s.k) openDay(s.k);
});
addEventListener("resize",()=>{ if(!document.getElementById("view-graph").hidden) drawChart(); });

/* ================= 起動 ================= */
resize();
renderAll();
requestAnimationFrame(frame);
